services:
  app:
    build: .
    container_name: money_pocket_app
    restart: unless-stopped
    env_file: 
      - .env
    ports:
      - "3000:3000"
    depends_on:
      - postgres

  postgress:
    image: postgres:18
    container_name: money_pocket_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: money_pocket_db
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql

volumes:
  dbdata: